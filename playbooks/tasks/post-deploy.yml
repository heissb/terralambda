---
- name: Wait for Lambda function to be ready
  pause:
    seconds: 10

- name: Test Lambda function
  include_role:
    name: lambda-test
  vars:
    function_name: "{{ lambda_config.function_name }}"
    aws_region: "{{ aws_region }}"

- name: Display deployment summary
  debug:
    msg:
      - "Deployment completed successfully!"
      - "Function: {{ lambda_config.function_name }}"
      - "Environment: {{ env_name }}"
      - "Region: {{ aws_region }}"
      - "Check CloudWatch logs for function execution details"
